apiVersion: apps/v1
kind: Deployment

metadata:
  name: my-first-deployment
  namespace: anushree
  labels:
    app: website

spec:
  replicas: 3

  selector:
    matchLabels:
      app: website

  template:
    metadata:
      labels:
        app: website

    spec:
      imagePullSecrets:
        - name: registry-secret

      containers:
        - name: my-app

          image: 634993259281.dkr.ecr.us-east-2.amazonaws.com/devops-portfolio:v1

          imagePullPolicy: Always

          ports:
            - containerPort: 8080

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"

            limits:
              cpu: "500m"
              memory: "512Mi"
